<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent — Working</title>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --text:#e6edf3; --muted:#8b9bb4; --accent:#3b82f6; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin:0; padding:1.5rem; }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); margin-bottom: 1rem; font-size: 0.9rem; }
  .metrics { background: var(--card); border-radius: 12px; padding: 1rem; display: grid; grid-template-columns: repeat(3,1fr); gap: 0.5rem; margin-bottom: 1rem; }
  .metric { text-align: center; }
  .metric span { display: block; font-size: 1.3rem; font-weight: 600; }
  .metric small { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; }
  button { background: var(--accent); color: #fff; border: none; padding: 0.7rem 1.2rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  button.listening { background: #dc2626; }
  #log { background: #0a0e14; color: #7dd3fc; padding: 1rem; border-radius: 12px; min-height: 160px; font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; margin-top: 1rem; }
  .note { margin-top: 1.5rem; font-size: 0.8rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="container">
  <h1>Voice Agent</h1>
  <p class="sub">Speak to check availability. Real microphone + TTS. Sponsored by Creignificent LLC.</p>

  <div class="metrics">
    <div class="metric"><small>Response time</small><span id="time">—</span></div>
    <div class="metric"><small>Task complete</small><span id="complete">—</span></div>
    <div class="metric"><small>State</small><span id="state">—</span></div>
  </div>

  <button id="mic">Hold to speak</button>
  <button id="stop" style="background:#334155; margin-left:0.5rem;">Stop TTS</button>

  <div id="log">Ready. Hold the button and speak a reservation request.</div>
  <p class="note">Sponsored by <strong>Creignificent LLC</strong></p>
</div>

<script>
const micBtn = document.getElementById("mic");
const stopBtn = document.getElementById("stop");
const logEl = document.getElementById("log");
const timeEl = document.getElementById("time");
const completeEl = document.getElementById("complete");
const stateEl = document.getElementById("state");

let recognition = null;
let speaking = false;

function log(msg) {
  logEl.textContent += (logEl.textContent.endsWith("\n") ? "" : "\n") + msg;
  logEl.scrollTop = logEl.scrollHeight;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  speaking = true;
  u.onend = () => speaking = false;
  window.speechSynthesis.speak(u);
}

stopBtn.onclick = () => {
  window.speechSynthesis.cancel();
  speaking = false;
  log("[Interrupt] TTS stopped");
};

function setupRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    log("Speech recognition not supported in this browser.");
    return null;
  }
  const rec = new SpeechRecognition();
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.continuous = false;
  return rec;
}

micBtn.onmousedown = micBtn.ontouchstart = async () => {
  if (speaking) {
    window.speechSynthesis.cancel();
    log("[Interrupt] User spoke while agent was talking");
  }
  recognition = setupRecognition();
  if (!recognition) return;
  micBtn.classList.add("listening");
  micBtn.textContent = "Listening…";
  logEl.textContent = "";
  recognition.onresult = async (e) => {
    const transcript = e.results[0][0].transcript;
    log("[You] " + transcript);
    await sendToAgent(transcript, speaking);
  };
  recognition.onerror = (e) => log("Mic error: " + e.error);
  recognition.onend = () => {
    micBtn.classList.remove("listening");
    micBtn.textContent = "Hold to speak";
  };
  recognition.start();
};

micBtn.onmouseup = micBtn.ontouchend = () => {
  if (recognition) recognition.stop();
};

async function sendToAgent(transcript, wasInterrupted) {
  try {
    const res = await fetch("/api/agent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ transcript, interrupt: wasInterrupted })
    });
    if (!res.ok) throw new Error(res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith("data: ")) {
          const data = JSON.parse(line.slice(6));
          log("[Agent] " + data.delta);
          log("Intent: " + data.intent + " | State: " + data.state);
          if (data.tool_result) log("Tool: " + JSON.stringify(data.tool_result));
          timeEl.textContent = data.metrics.response_time_ms + " ms";
          completeEl.textContent = data.metrics.task_completed ? "Yes" : "No";
          stateEl.textContent = data.state;
          speak(data.delta);
        }
      }
    }
  } catch (err) {
    log("Backend error — falling back. " + err);
    const fallback = "I can check availability. How many people and what day?";
    log("[Agent] " + fallback);
    speak(fallback);
  }
}
</script>
</body>
</html>
